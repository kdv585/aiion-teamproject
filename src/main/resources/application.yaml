spring:
  application:
    name: api
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/aidb
    username: aiion
    password: aiion4man
    driver-class-name: org.postgresql.Driver
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update   # 테이블 자동 업데이트
    show-sql: true       # 콘솔에 SQL 출력
